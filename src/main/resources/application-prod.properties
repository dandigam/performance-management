# Set APP_CONFIG_FILE to an absolute server-side properties file, or use environment variables.
spring.config.import=optional:file:${APP_CONFIG_FILE:./config/production.properties}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.security.authentication-required=${AUTHENTICATION_REQUIRED:true}
app.mail.base-url=${APP_BASE_URL}
app.security.allowed-origins=${ALLOWED_ORIGINS:${app.mail.base-url}}
app.security.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:}
