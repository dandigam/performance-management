spring.application.name=performance-management-system
spring.profiles.default=local

# Springdoc (OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operationsSorter=method
spring.main.allow-bean-definition-overriding=true

# Security
# Local development defaults. Production must override these environment variables.
app.security.authentication-required=${AUTHENTICATION_REQUIRED:false}
jwt.secret=7f19a0e9-4b6c-4cc1-a023-bf93420fd26e-59ad2df7-cf30-453f-821b-a78d4109c376
jwt.issuer=${JWT_ISSUER:performance-management-system}
jwt.audience=${JWT_AUDIENCE:performance-management-ui}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# APP_BASE_URL must be an origin (scheme, host and optional port; no path or trailing slash).
app.security.allowed-origins=${ALLOWED_ORIGINS:${app.mail.base-url},http://localhost:5173,http://localhost:8080,http://localhost:8081}
app.security.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:https://*.trycloudflare.com}
