spring.application.name=performance-management-system
spring.config.import=optional:file:.local/application-secrets.properties

# Springdoc (OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operationsSorter=method
spring.main.allow-bean-definition-overriding=true

# Security
# Local development defaults. Production must override these environment variables.
app.security.authentication-required=${AUTHENTICATION_REQUIRED:false}
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production-2026}
jwt.issuer=${JWT_ISSUER:performance-management-system}
jwt.audience=${JWT_AUDIENCE:performance-management-ui}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8081}
app.security.secure-cookie=${SECURE_COOKIE:false}

# AI assistant (set OPENAI_API_KEY in the environment or .local/application-secrets.properties)
app.ai.openai.api-key=${OPENAI_API_KEY}
app.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Gemini AI assistant (set GEMINI_API_KEY in .local/application-secrets.properties or the environment)
app.ai.gemini.api-key=${GEMINI_API_KEY}
app.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Previous local MySQL configuration:
 spring.datasource.url=jdbc:mysql://localhost:3306/rit_portal_db_dev
 spring.datasource.username=root
 spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local document storage
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:C:/Users/dandi/projects/performance-management-documents}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Email delivery
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.mail.footer=${MAIL_FOOTER:Regards, RIT Performance Management}
app.mail.base-url=${APP_BASE_URL:http://localhost:8081}
app.mail.max-retries=${MAIL_MAX_RETRIES:3}
app.mail.dispatch-delay-ms=${MAIL_DISPATCH_DELAY_MS:30000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
