spring.application.name=performance-management-system

# Springdoc (OpenAPI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operationsSorter=method
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:mysql://localhost:3306/performance_management
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local document storage
app.documents.storage-path=C:/Users/dandi/projects/performance-management-documents
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

