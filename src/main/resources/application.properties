# Calendar dates use the business zone; timestamp persistence uses UTC.
app.business.time-zone=${BUSINESS_TIME_ZONE:America/New_York}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Bind LocalDateTime directly, avoiding JVM-local java.sql.Timestamp conversion.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
# Keep instant-valued columns and MySQL session timestamps aligned with UTC too.
spring.datasource.hikari.data-source-properties.connectionTimeZone=+00:00
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
