<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#0f172a;"><table role="presentation" width="100%"><tr><td align="center" style="padding:32px 16px;"><table role="presentation" width="600" style="width:100%;max-width:600px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;"><tr th:replace="~{fragments/header :: header('Notification')}"></tr><tr><td style="padding:32px;"><p th:if="${recipientName != null and !recipientName.isBlank()}">Hello <span th:text="${recipientName}"></span>,</p><div th:text="${message}" style="white-space:pre-wrap;color:#475569;line-height:24px;"></div><a th:if="${actionUrl != null and !actionUrl.isBlank()}" th:href="${actionUrl}" style="display:inline-block;margin-top:24px;padding:12px 22px;background:#0876d1;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold;">Open application</a></td></tr><tr th:replace="~{fragments/footer :: footer}"></tr></table></td></tr></table></body></html>
