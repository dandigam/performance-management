<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="600" style="width:100%;max-width:600px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;">
<tr th:replace="~{fragments/header :: header('Password verification')}"></tr>
<tr><td style="padding:32px;">
  <h1 style="font-size:22px;">Your verification code</h1>
  <p style="color:#475569;line-height:24px;">Enter this code on the password page to <span th:text="${purpose}"></span>.</p>
  <p th:text="${otp}" style="padding:20px;background:#f8fafc;border:1px solid #dbe3ee;border-radius:8px;font-size:30px;letter-spacing:6px;font-weight:bold;text-align:center;"></p>
  <p style="color:#475569;line-height:24px;">The code expires in 10 minutes, or when your setup/reset link expires, whichever comes first. Only the most recent code works.</p>
  <p style="color:#64748b;font-size:13px;line-height:20px;">Do not share this code. If you did not request it, ignore this email. Your password has not changed.</p>
</td></tr>
<tr th:replace="~{fragments/footer :: footer}"></tr>
</table></td></tr></table>
</body></html>
