<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#0f172a;"><table width="100%"><tr><td align="center" style="padding:32px 16px;"><table width="600" style="width:100%;max-width:600px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;"><tr th:replace="~{fragments/header :: header('Invoice notification')}"></tr><tr><td style="padding:32px;"><p>Hello team,</p><h1 style="font-size:22px;">Invoice <span th:text="${action}"></span></h1><table width="100%" style="border:1px solid #dbe3ee;border-radius:8px;"><tr><td style="padding:10px 16px;color:#64748b;">Invoice ID</td><td th:text="${invoiceId}" align="right" style="padding:10px 16px;font-weight:bold;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Invoice number</td><td th:text="${invoiceNumber}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;">SOW</td><td th:text="${sowName}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Milestone</td><td th:text="${milestoneName}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;" th:text="${dateLabel}">Invoice date</td><td th:text="${invoiceDate}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;" th:text="${amountLabel}">Invoice amount</td><td th:text="${invoiceAmount}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr th:if="${raisedAmount != null and !raisedAmount.toString().isBlank()}"><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Raised amount</td><td th:text="${raisedAmount}" align="right" style="padding:10px 16px;font-weight:bold;border-top:1px solid #e2e8f0;"></td></tr><tr><td style="padding:10px 16px;color:#64748b;border-top:1px solid #e2e8f0;" th:text="${statusLabel}">Status</td><td align="right" style="padding:10px 16px;border-top:1px solid #e2e8f0;"><span th:text="${status}" style="padding:5px 10px;background:#dcfce7;color:#166534;border-radius:999px;font-size:12px;font-weight:bold;"></span></td></tr></table><a th:href="${actionUrl}" style="display:inline-block;margin-top:24px;padding:12px 22px;background:#0876d1;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold;">Open invoices</a></td></tr><tr th:replace="~{fragments/footer :: footer}"></tr></table></td></tr></table></body></html>
