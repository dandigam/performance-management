<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#0f172a;"><table width="100%"><tr><td align="center" style="padding:32px 16px;"><table width="600" style="width:100%;max-width:600px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;"><tr th:replace="~{fragments/header :: header('Performance review')}"></tr><tr><td style="padding:32px;"><p>Hello <span th:text="${recipientName}"></span>,</p><h1 style="font-size:22px;">A performance assessment is ready for your review</h1><p style="color:#475569;line-height:24px;"><strong th:text="${previousStageName}"></strong> for <strong th:text="${employeeName}"></strong> has been submitted. Your <strong th:text="${roleName}"></strong> assessment for <strong th:text="${cycleName}"></strong> is now ready. Please sign in to review the assessment and submit your feedback.</p><div th:if="${dueDate != null}" style="padding:14px 16px;background:#f8fafc;border:1px solid #dbe3ee;border-radius:8px;">Due date: <strong th:text="${dueDate}"></strong><div th:if="${reopenReason != null and !reopenReason.isBlank()}" style="margin-top:8px;">Reason for reopening: <span th:text="${reopenReason}"></span></div></div><a th:href="${actionUrl}" style="display:inline-block;margin-top:24px;padding:12px 22px;background:#0876d1;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold;">Review assessment</a></td></tr><tr th:replace="~{fragments/footer :: footer}"></tr></table></td></tr></table></body></html>
