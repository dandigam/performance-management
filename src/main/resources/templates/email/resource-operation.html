<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailInfo Tech notification</title>
</head>
<body style="margin:0;padding:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6fa;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0"
           style="width:100%;max-width:600px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;">
      <tr th:replace="~{fragments/header :: header(${notificationTitle ?: 'Resource notification'})}"></tr>
      <tr><td style="padding:32px;">
        <p style="margin:0 0 20px;font-size:16px;line-height:24px;">
          Hello <span th:text="${recipientName}">Employee</span>,
        </p>
        <h1 th:text="${actionMessage}" style="margin:0 0 22px;font-size:22px;line-height:30px;">
          Your resource assignment was updated.
        </h1>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="border:1px solid #dbe3ee;border-radius:8px;border-collapse:separate;">
          <tr th:each="detail, row : ${details}">
            <td th:text="${detail.label}" th:style="${row.last} ? 'padding:12px 16px;color:#64748b;' : 'padding:12px 16px;color:#64748b;border-bottom:1px solid #e2e8f0;'">Label</td>
            <td th:text="${detail.value}" align="right" th:style="${row.last} ? 'padding:12px 16px;font-weight:600;' : 'padding:12px 16px;font-weight:600;border-bottom:1px solid #e2e8f0;'">Value</td>
          </tr>
          <tr>
            <td style="padding:12px 16px;color:#64748b;border-top:1px solid #e2e8f0;">Status</td>
            <td align="right" style="padding:12px 16px;border-top:1px solid #e2e8f0;">
              <span th:text="${status}" th:style="|display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:capitalize;background:${statusBackground};color:${statusColor};|">Completed</span>
            </td>
          </tr>
        </table>
        <table role="presentation" cellspacing="0" cellpadding="0" style="margin-top:28px;">
          <tr><td style="background:#0876d1;border-radius:6px;">
            <a th:href="${actionUrl}" style="display:inline-block;padding:12px 22px;color:#fff;font-size:15px;font-weight:700;text-decoration:none;">Open application</a>
          </td></tr>
        </table>
      </td></tr>
      <tr th:replace="~{fragments/footer :: footer}"></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
